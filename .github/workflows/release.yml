name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and package zip
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}' -replace '^v', ''
          ./scripts/build.ps1 -Target x86_64-pc-windows-msvc -Version $v
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/artifacts/*.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: bash scripts/install-cross-deps.sh
      - name: Build
        run: TMJ_VERSION="${GITHUB_REF_NAME#v}" bash scripts/build.sh x86_64-unknown-linux-gnu
      - name: Package all zips
        run: |
          V="${GITHUB_REF_NAME#v}"
          for variant in tmj tmj-wgpu; do
            bash scripts/package-zip.sh x86_64-unknown-linux-gnu "$V" "$variant"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux-zip
          path: target/artifacts/tmj*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: linux-staging
          path: staging/

  package-deb:
    needs: build-linux
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant:
          - tmj
          - tmj-wgpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-staging
          path: staging
      - name: Package .deb
        run: bash scripts/package-deb.sh x86_64-unknown-linux-gnu '${{ github.ref_name }}' ${{ matrix.variant }}
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.variant }}
          path: target/artifacts/*.deb

  package-arch:
    needs: build-linux
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant:
          - tmj
          - tmj-wgpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-staging
          path: staging
      - name: Package .pkg.tar.zst
        run: bash scripts/package-arch.sh x86_64-unknown-linux-gnu '${{ github.ref_name }}' ${{ matrix.variant }}
      - uses: actions/upload-artifact@v4
        with:
          name: arch-${{ matrix.variant }}
          path: target/artifacts/*.pkg.tar.zst

  draft:
    needs: [build-windows, build-linux, package-deb, package-arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          name: ${{ github.ref_name }}
          files: |
            artifacts/windows/*.zip
            artifacts/linux-zip/*.zip
            artifacts/deb-*/*.deb
            artifacts/arch-*/*.pkg.tar.zst
